{% extends 'base.html' %}

{% block title %}Check Your Email — {{ app_name }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-sm-10 col-md-7 col-lg-5 text-center">
            <i class="bi bi-envelope-check text-patriot-blue" style="font-size:3rem"></i>
            <h3 class="mt-3 heading-serif">Check Your Email</h3>
            <p class="text-muted">
                If an account exists for that email, we've sent a password reset link.
                Check your spam folder if you don't see it.
            </p>
            <a href="{% url 'accounts:login' %}" class="btn btn-outline-secondary mt-2">Back to Log In</a>
        </div>
    </div>
</div>
{% endblock %}
