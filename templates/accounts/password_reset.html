{% extends 'base.html' %}

{% block title %}Reset Password — {{ app_name }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-sm-10 col-md-7 col-lg-5">
            <div class="card card-patriot shadow-sm">
                <div class="card-header py-3">
                    <h4 class="mb-0"><i class="bi bi-key me-2"></i>Reset Password</h4>
                </div>
                <div class="card-body p-4">
                    <p class="text-muted mb-4">Enter your email and we'll send a reset link.</p>
                    <form method="post" novalidate>
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold">{{ form.email.label }}</label>
                            {{ form.email }}
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-patriot-primary">Send Reset Link</button>
                        </div>
                    </form>
                </div>
            </div>
            <div class="text-center mt-3">
                <a href="{% url 'accounts:login' %}" class="small text-muted">
                    <i class="bi bi-arrow-left me-1"></i>Back to Log In
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
