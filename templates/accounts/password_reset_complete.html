{% extends 'base.html' %}

{% block title %}Password Updated — {{ app_name }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-sm-10 col-md-7 col-lg-5 text-center">
            <i class="bi bi-check-circle-fill text-success" style="font-size:3rem"></i>
            <h3 class="mt-3 heading-serif">Password Updated</h3>
            <p class="text-muted">Your password has been set. You can now log in.</p>
            <a href="{% url 'accounts:login' %}" class="btn btn-patriot-primary mt-2">Log In</a>
        </div>
    </div>
</div>
{% endblock %}
